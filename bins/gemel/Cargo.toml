[package]
name = "gemel"
description = "Command-line and text UI frontend, and headless server mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# The library is the program, which `gemel-gui` runs too; the binary is
# its `main`. Only the library is documented, so that the two don't
# collide under `cargo doc`.
[[bin]]
name = "gemel"
doc = false

[dependencies]
gemel-base.workspace = true
gemel-fs.workspace = true
gemel-rpc.workspace = true
gemel-ui-api.workspace = true
tokio.workspace = true

[dev-dependencies]
# For the engine's and the interface's test support, which these tests share.
gemel-engine.workspace = true
md-5.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# For a pseudo-terminal, in tests/terminal.rs.
libc.workspace = true

[lints]
workspace = true

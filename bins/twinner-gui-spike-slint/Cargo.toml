[package]
name = "twinner-gui-spike-slint"
description = "Throwaway GUI spike: the recon-table slice in Slint (see §6 of docs/unison-port-analysis.md)"
version.workspace = true
edition.workspace = true
# Slint 1.18 needs 1.92.
rust-version = "1.92"
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
twinner-gui-spike-model = { path = "../../crates/twinner-gui-spike-model" }
slint = { version = "=1.18.1", features = ["raw-window-handle-06"] }
rfd = "0.17.2"

[dev-dependencies]
# Slint's headless testing backend: element queries by accessible role.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"

[lints]
workspace = true

[package]
name = "gemel-gui"
description = "Graphical frontend, built with Slint"
version.workspace = true
edition.workspace = true
# Slint 1.18 needs 1.92.
rust-version = "1.92"
# The sources are GPL-3.0-or-later like the rest of gemel, but Slint is
# used under its GPL-3.0-only option, so the binary is GPLv3-only.
license.workspace = true
authors.workspace = true
publish.workspace = true

# The library is the program with its window, which the tests drive; the
# binary is its `main`. Only the library is documented, so that the two
# don't collide under `cargo doc`.
[[bin]]
name = "gemel-gui"
doc = false

[dependencies]
# The program: the text interface and the server modes, as unison-gui
# links them.
gemel.workspace = true
gemel-ui-api.workspace = true
slint = { version = "=1.18.1", features = ["raw-window-handle-06"] }
rfd = "0.17.2"

# macOS's own Quit through the window's (src/macos.rs): the version rfd
# and Slint's menus use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
# The harness's scenarios, runs and comparisons (tests/support).
gemel-oracle.workspace = true
# Slint's headless testing backend: element queries by accessible role,
# and the software renderer for the screenshots. Must match the slint
# version exactly.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
# The screenshots' PNGs.
png = "0.18.1"
# StyledText's text, to check the documentation reads as markdown.
i-slint-core = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"

[lints]
workspace = true

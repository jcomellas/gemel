[package]
name = "twinner-gui-spike-egui"
description = "Throwaway GUI spike: the recon-table slice in egui/eframe (see §6 of docs/unison-port-analysis.md)"
version.workspace = true
edition.workspace = true
# egui 0.36 needs 1.95.
rust-version = "1.95"
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
twinner-gui-spike-model = { path = "../../crates/twinner-gui-spike-model" }
eframe = "=0.36.2"
egui_extras = "=0.36.2"
rfd = "0.17.2"

# eframe has no menu bar; muda provides the native one. macOS only: on
# Linux muda pulls in GTK3, and the spike only targets the macOS menu bar.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"

[lints]
workspace = true

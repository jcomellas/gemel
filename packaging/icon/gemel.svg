<?xml version="1.0" encoding="UTF-8"?>
<!-- gemel's icon: two interlocking rings, twins kept in sync. A plain
     placeholder; scripts/make-icons.sh builds the packages' icons from it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82c4"/>
      <stop offset="1" stop-color="#1f4f86"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g fill="none" stroke-width="72" stroke-linecap="round">
    <circle cx="400" cy="512" r="200" stroke="#ffffff"/>
    <circle cx="624" cy="512" r="200" stroke="#f2b33d"/>
    <!-- The first ring passes over the second at the top, so they link. -->
    <path d="M 400 312 A 200 200 0 0 1 573 412" stroke="#ffffff"/>
  </g>
</svg>

# cargo-about's settings for the packages' THIRD-PARTY-LICENSES
# (scripts/third-party-licenses.sh): the licences of the crates the
# programs are built with, for the systems they are packaged for. gemel's
# own crates are unpublished, and left out. Slint's crates are offered
# under GPL-3.0-only or Slint's own licences; gemel uses them under
# GPL-3.0-only, which is accepted and the others aren't.
private = { ignore = true }
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

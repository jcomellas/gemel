name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Slint's text stack (fontique) links fontconfig at build time.
      # docker/linux/Dockerfile has the same build dependencies.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/check-no-gui-deps.sh
        shell: bash

  oracle:
    # Self-test of the differential harness (tools/oracle) against OCaml
    # Unison built from the pinned source that the fixtures also come from.
    # Once gemel can sync, this job runs it as the candidate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bcpierce00/unison
          ref: 8772d26a2eb77cfd0cb6da81807e81f24f51044c
          path: unison-src
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml make
      - run: make -C unison-src tui
      - run: cargo run --locked -p gemel-oracle -- --reference unison-src/src/unison --count 20
      # gemel reads replicas as this OCaml Unison does (gemel-engine/tests/reading.rs),
      # finds no updates in the archives it writes (tests/update.rs), and accepts
      # the archives gemel commits (tests/commit.rs).
      - run: cargo test --locked -p gemel-engine --test reading --test update --test commit --test recon --test copy --test files --test transport
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # Whole syncs from a profile, through uicommon's startup and the session.
      - run: cargo test --locked -p gemel-ui-api --test startup --test session
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # The gemel program, in batch and interactive mode, against `unison -ui text`.
      - run: cargo test --locked -p gemel --test batch --test interactive --test terminal --test repeat
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison

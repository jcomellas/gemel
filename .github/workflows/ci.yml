name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Slint's text stack (fontique) links fontconfig at build time.
      # docker/linux/Dockerfile has the same build dependencies.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/check-no-gui-deps.sh
        shell: bash
      # There is no OCaml Unison on Windows, nor on the macOS runner: gemel
      # replays the outcomes the oracle job checks are still the pinned
      # reference's.
      - if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --locked -p gemel
          cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows.txt --candidate target/debug/gemel${{ runner.os == 'Windows' && '.exe' || '' }}

  oracle:
    # The differential harness (tools/oracle) against OCaml Unison built
    # from the pinned source that the fixtures also come from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bcpierce00/unison
          ref: 8772d26a2eb77cfd0cb6da81807e81f24f51044c
          path: unison-src
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml make
      # OCaml looks for its watcher next to its binary first; keep it
      # elsewhere, so that each test chooses the watcher OCaml finds.
      - run: |
          make -C unison-src tui fsmonitor
          mv unison-src/src/unison-fsmonitor unison-src/fsmonitor-ocaml
      # The harness's self-test, then gemel on generated scenarios.
      - run: cargo run --locked -p gemel-oracle -- --reference unison-src/src/unison --count 20
      - run: cargo build --locked -p gemel
      - run: cargo run --locked -p gemel-oracle -- --reference unison-src/src/unison --candidate target/debug/gemel --count 100
      # The outcomes Windows replays are still the reference's, and gemel
      # agrees with them here too.
      - run: cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows.txt --candidate unison-src/src/unison
      - run: cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows.txt --candidate target/debug/gemel
      # gemel reads replicas as this OCaml Unison does (gemel-engine/tests/reading.rs),
      # finds no updates in the archives it writes (tests/update.rs), and accepts
      # the archives gemel commits (tests/commit.rs).
      - run: cargo test --locked -p gemel-engine --test reading --test update --test commit --test recon --test copy --test files --test transport
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # Whole syncs from a profile, through uicommon's startup and the session.
      - run: cargo test --locked -p gemel-ui-api --test startup --test session
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # The gemel program, in batch and interactive mode, against `unison -ui text`.
      # (Watch mode: gemel finds its watcher next to it, which `-p gemel`
      # doesn't build; OCaml its own on PATH, where the tests put it.)
      - run: |
          cargo build --locked -p gemel-fsmonitor
          cargo test --locked -p gemel --test batch --test interactive --test terminal --test repeat --test watch
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
          GEMEL_REFERENCE_FSMONITOR: ${{ github.workspace }}/unison-src/fsmonitor-ocaml
      # The file watcher, against OCaml's (inotify), and as OCaml's watcher.
      - run: cargo test --locked -p gemel-fsmonitor
        env:
          GEMEL_REFERENCE_FSMONITOR: ${{ github.workspace }}/unison-src/fsmonitor-ocaml
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # Update detection with OCaml's watcher. (The test jobs run it with
      # gemel's, which `cargo test --workspace` builds.)
      - run: cargo test --locked -p gemel-engine --test watch
        env:
          GEMEL_REFERENCE_FSMONITOR: ${{ github.workspace }}/unison-src/fsmonitor-ocaml

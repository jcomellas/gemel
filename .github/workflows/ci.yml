name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Slint's text stack (fontique) links fontconfig at build time.
      # docker/linux/Dockerfile has the same build dependencies.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/check-no-gui-deps.sh
        shell: bash
      # There is no OCaml Unison on Windows, nor on the macOS runner: gemel
      # replays the outcomes the oracle job checks are still the pinned
      # reference's.
      - if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --locked -p gemel
          gemel=target/debug/gemel${{ runner.os == 'Windows' && '.exe' || '' }}
          cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows.txt --candidate $gemel
          cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows-socket.txt --candidate $gemel

  oracle:
    # The differential harness (tools/oracle) against OCaml Unison built
    # from the pinned source that the fixtures also come from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bcpierce00/unison
          ref: 8772d26a2eb77cfd0cb6da81807e81f24f51044c
          path: unison-src
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml make
      # OCaml looks for its watcher next to its binary first; keep it
      # elsewhere, so that each test chooses the watcher OCaml finds. The
      # same goes for fsmonitor.py, which OCaml's old watcher runs when it
      # sits there and which gemel doesn't port.
      - run: |
          make -C unison-src tui fsmonitor
          mv unison-src/src/unison-fsmonitor unison-src/fsmonitor-ocaml
          mv unison-src/src/fsmonitor.py unison-src/fsmonitor.py
      # The harness's self-test, then gemel on generated scenarios.
      - run: cargo run --locked -p gemel-oracle -- --reference unison-src/src/unison --count 20
      - run: cargo build --locked -p gemel
      - run: cargo run --locked -p gemel-oracle -- --reference unison-src/src/unison --candidate target/debug/gemel --count 100
      # The outcomes Windows replays are still the reference's, and gemel
      # agrees with them here too.
      - run: cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows.txt --candidate unison-src/src/unison
      - run: cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows.txt --candidate target/debug/gemel
      # Remote roots (milestone 3), over the ssh shim and on a socket: the
      # pinned source at both ends, then mixed with the releases gemel must
      # work with, built with the same OCaml and cached by tag. Each pairing
      # is checked against itself. Then a gemel server, over ssh, with each
      # client: checked against the same client with the pinned source as
      # its server, with items one at a time, then concurrently, as clients
      # run them by default. Then a gemel client with each server (2.52 and
      # 2.53 also in their compatibility mode), and gemel at both ends,
      # against the pinned client with the same server. (A gemel client
      # runs items one at a time until phase 5.)
      - id: ocaml
        run: echo "version=$(ocamlopt -version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: releases
        with:
          path: releases
          key: ocaml-unison-releases-v2.52.1-v2.53.8-${{ runner.os }}-ocaml-${{ steps.ocaml.outputs.version }}
      - if: steps.releases.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bcpierce00/unison
          ref: v2.52.1
          path: unison-2.52.1
      - if: steps.releases.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bcpierce00/unison
          ref: v2.53.8
          path: unison-2.53.8
      # 2.52's Makefile has `text`; the build system 2.53 brought has `tui`.
      - if: steps.releases.outputs.cache-hit != 'true'
        run: |
          make -C unison-2.52.1 text
          make -C unison-2.53.8 tui
          mkdir -p releases
          cp unison-2.52.1/src/unison releases/unison-2.52.1
          cp unison-2.53.8/src/unison releases/unison-2.53.8
      - run: |
          oracle() { cargo run --locked -q -p gemel-oracle -- "$@"; }
          for remote in ssh socket; do
            oracle --remote $remote --reference unison-src/src/unison --count 20
            for v in 2.52.1 2.53.8; do
              oracle --remote $remote --reference unison-src/src/unison --reference-server releases/unison-$v --count 10
              oracle --remote $remote --reference releases/unison-$v --reference-server unison-src/src/unison --count 10
            done
          done
          # ssh, and sockets with fewer scenarios: a socket server of 2.52 or
          # 2.53 starts in its compatibility mode.
          for remote in ssh socket; do
            [ $remote = ssh ] && n=50 m=20 || n=30 m=10
            for c in "" --concurrent; do
              oracle --remote $remote $c --reference unison-src/src/unison --candidate-server target/debug/gemel --count $n
              for v in 2.52.1 2.53.8; do
                oracle --remote $remote $c --reference releases/unison-$v --reference-server unison-src/src/unison \
                  --candidate releases/unison-$v --candidate-server target/debug/gemel --count $m
              done
            done
            # What a gemel server sends, in OCaml's order, with items concurrent. Copying
            # contents another transfer brings replies in another order (phase 5b's notes),
            # so without that.
            oracle --remote $remote --concurrent --ordered --client-args -xferbycopying=false \
              --reference unison-src/src/unison --candidate-server target/debug/gemel --count 30
            oracle --remote $remote --reference unison-src/src/unison --candidate target/debug/gemel \
              --candidate-server unison-src/src/unison --count $n
            # A gemel client running items concurrently, in OCaml's order as above, and as
            # it comes otherwise.
            oracle --remote $remote --concurrent --ordered --client-args -xferbycopying=false \
              --reference unison-src/src/unison --candidate target/debug/gemel \
              --candidate-server unison-src/src/unison --count 30
            oracle --remote $remote --concurrent --reference unison-src/src/unison --candidate target/debug/gemel \
              --candidate-server unison-src/src/unison --count $n
            for v in 2.52.1 2.53.8; do
              oracle --remote $remote --reference unison-src/src/unison --reference-server releases/unison-$v \
                --candidate target/debug/gemel --candidate-server releases/unison-$v --count $m
            done
            oracle --remote $remote --reference unison-src/src/unison --candidate target/debug/gemel --count $n
            oracle --remote $remote --concurrent --ordered --client-args -xferbycopying=false \
              --reference unison-src/src/unison --candidate target/debug/gemel --count 30
          done
          for v in 2.52.1 2.53.8; do
            oracle --remote ssh --old-server --reference unison-src/src/unison --reference-server releases/unison-$v \
              --candidate target/debug/gemel --candidate-server releases/unison-$v --count 20
          done
        shell: bash
      # Outcomes on a socket for Windows, still the reference's.
      - run: cargo run --locked -p gemel-oracle -- --replay tools/oracle/recorded/windows-socket.txt --candidate unison-src/src/unison
      # gemel reads replicas as this OCaml Unison does (gemel-engine/tests/reading.rs),
      # finds no updates in the archives it writes (tests/update.rs), and accepts
      # the archives gemel commits (tests/commit.rs).
      - run: cargo test --locked -p gemel-engine --test reading --test update --test commit --test recon --test copy --test files --test transport
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # Whole syncs from a profile, through uicommon's startup and the session.
      - run: cargo test --locked -p gemel-ui-api --test startup --test session
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # The gemel program, in batch and interactive mode, against `unison -ui text`,
      # as a server, against `unison -server`, as a client of broken servers, and
      # on sockets, against `unison -socket`, and resuming transfers both ways.
      # (Watch mode: gemel finds its watcher next to it, which `-p gemel`
      # doesn't build; OCaml its own on PATH, where the tests put it.)
      - run: |
          cargo build --locked -p gemel-fsmonitor
          cargo test --locked -p gemel --test batch --test interactive --test terminal --test repeat --test watch --test server --test client --test socket --test transfer
        env:
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
          GEMEL_REFERENCE_FSMONITOR: ${{ github.workspace }}/unison-src/fsmonitor-ocaml
      # The file watcher, against OCaml's (inotify), and as OCaml's watcher.
      - run: cargo test --locked -p gemel-fsmonitor
        env:
          GEMEL_REFERENCE_FSMONITOR: ${{ github.workspace }}/unison-src/fsmonitor-ocaml
          GEMEL_REFERENCE_UNISON: ${{ github.workspace }}/unison-src/src/unison
      # Update detection with OCaml's watcher. (The test jobs run it with
      # gemel's, which `cargo test --workspace` builds.)
      - run: cargo test --locked -p gemel-engine --test watch
        env:
          GEMEL_REFERENCE_FSMONITOR: ${{ github.workspace }}/unison-src/fsmonitor-ocaml

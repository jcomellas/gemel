name: Packages

# gemel-gui's packages, built on every push and pull request, and checked:
# each is installed, mounted or extracted as a person's system would, and
# the programs in it start (on Linux, the window too, under Xvfb). The
# release workflow runs the same jobs on tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: scripts/package-macos.sh target/package
      # From the mounted disk image: the bundle's signature, its name in the
      # menu bar, universal binaries, and the programs starting.
      - run: |
          m=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$m" target/package/Gemel-*-macos.dmg
          app=$m/Gemel.app
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = Gemel
          for b in gemel-gui gemel gemel-fsmonitor; do
            lipo -archs "$app/Contents/MacOS/$b" | grep -qw x86_64
            lipo -archs "$app/Contents/MacOS/$b" | grep -qw arm64
          done
          "$app/Contents/MacOS/gemel-gui" -version | grep '^gemel version '
          "$app/Contents/MacOS/gemel" -version | grep '^gemel version '
          "$app/Contents/MacOS/gemel-fsmonitor" -version </dev/null | grep '^VERSION '
          for f in Gemel.icns LICENSE NOTICE THIRD-PARTY-LICENSES; do
            test -s "$app/Contents/Resources/$f"
          done
          hdiutil detach "$m"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: target/package/Gemel-*-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: |
          dotnet tool install --global wix --version 5.0.2
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE '.dotnet\tools')
      - run: scripts/package-windows.sh target/package
        shell: bash
      # Installed for all users as a person would, the programs starting
      # from Program Files, the Start menu entry and the notices there, then
      # uninstalled. msiexec returns at once unless waited for.
      - shell: pwsh
        run: |
          $msi = (Get-Item target/package/Gemel-*-x64.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; exit 1 }
          $dir = Join-Path $env:ProgramFiles Gemel
          foreach ($b in 'gemel-gui', 'gemel') {
            $v = & (Join-Path $dir "$b.exe") -version
            if ($LASTEXITCODE -ne 0 -or $v -notmatch '^gemel version ') { "$b -version: $v"; exit 1 }
          }
          # gemel-gui is a program for the window (its PE header's
          # subsystem is 2), which opens no console; gemel is a console
          # program (3).
          function Subsystem($exe) {
            $b = [IO.File]::ReadAllBytes($exe)
            [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 0x5C)
          }
          foreach ($p in @(@('gemel-gui', 2), @('gemel', 3))) {
            $s = Subsystem (Join-Path $dir "$($p[0]).exe")
            if ($s -ne $p[1]) { "$($p[0]).exe's subsystem is $s, not $($p[1])"; exit 1 }
          }
          foreach ($f in 'gemel-fsmonitor.exe', 'LICENSE.txt', 'NOTICE.txt', 'THIRD-PARTY-LICENSES.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { "missing $f"; exit 1 }
          }
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Gemel.lnk'
          if (-not (Test-Path $lnk)) { "missing $lnk"; exit 1 }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; exit 1 }
          if (Test-Path (Join-Path $dir 'gemel-gui.exe')) { 'still installed after uninstalling'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: target/package/Gemel-*-x64.msi
          if-no-files-found: error

  # On the oldest Ubuntu with runners, for the oldest glibc it can need.
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Building: Slint's fontconfig. Starting the window: Xvfb, X11's
      # client libraries and Mesa's GL, which winit and glutin load.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev \
              xvfb xauth libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 \
              libgl1 libegl1 libgl1-mesa-dri desktop-file-utils
      - run: scripts/package-appimage.sh target/package
      # Extracted rather than mounted, since runners may have no FUSE: the
      # programs starting, the notices, the glibc it needs, and the window.
      - run: |
          img=$(echo target/package/Gemel-*-x86_64.AppImage)
          "$img" --appimage-extract-and-run -version | grep '^gemel version '
          "$img" --appimage-extract >/dev/null
          r=squashfs-root
          "$r/usr/bin/gemel" -version | grep '^gemel version '
          "$r/usr/bin/gemel-fsmonitor" -version </dev/null | grep '^VERSION '
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES; do test -s "$r/usr/share/doc/gemel/$f"; done
          desktop-file-validate "$r/io.github.jcomellas.gemel.desktop"
          # The README says glibc 2.35, Ubuntu 22.04's, is enough.
          need=$(objdump -T "$r"/usr/bin/* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc needed: $need"
          test "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35
          scripts/smoke-linux-gui.sh "$img" --appimage-extract-and-run
      - uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: target/package/Gemel-*-x86_64.AppImage
          if-no-files-found: error
      # For the Flatpak's job, whose container has no cargo.
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: target/package/THIRD-PARTY-LICENSES
          if-no-files-found: error

  # In Flathub's image for building Flatpaks, which bubblewrap needs
  # privileged.
  flatpak:
    needs: appimage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: target/flatpak
      - run: scripts/package-flatpak.sh target/package
      # Installed as a person would, from the bundle: the programs
      # starting, the runtime's ssh, the notices, and the window.
      - run: |
          id=io.github.jcomellas.gemel
          flatpak install --user -y --noninteractive target/package/Gemel-*-x86_64.flatpak
          flatpak run $id -version | grep '^gemel version '
          flatpak run --command=gemel $id -version | grep '^gemel version '
          flatpak run --command=gemel-fsmonitor $id -version </dev/null | grep '^VERSION '
          flatpak run --command=sh $id -c 'command -v ssh && ssh -V'
          flatpak run --command=sh $id -c \
              'for f in LICENSE NOTICE THIRD-PARTY-LICENSES; do test -s /app/share/licenses/'$id'/$f; done'
          dbus-run-session -- scripts/smoke-linux-gui.sh flatpak run $id
      - uses: actions/upload-artifact@v4
        with:
          name: package-flatpak
          path: target/package/Gemel-*-x86_64.flatpak
          if-no-files-found: error

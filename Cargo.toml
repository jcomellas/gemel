[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"  # minimum for edition 2024; untested until CI adds an MSRV job
license = "GPL-3.0-or-later"
authors = ["Juan Jose Comellas <juanjo@comellas.org>"]
description = "A Rust port of the Unison file synchronizer"
publish = false

[workspace.dependencies]
twinner-compat = { path = "crates/twinner-compat" }
twinner-base = { path = "crates/twinner-base" }
twinner-fs = { path = "crates/twinner-fs" }
twinner-rpc = { path = "crates/twinner-rpc" }
twinner-engine = { path = "crates/twinner-engine" }
twinner-ui-api = { path = "crates/twinner-ui-api" }

[workspace.lints.rust]
# `deny` rather than `forbid` so that twinner-fs can opt in for FFI
# (xattr/ACL/clonefile) with a crate-level `#![allow(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"

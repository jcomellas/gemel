[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "tools/oracle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"  # minimum for edition 2024; untested until CI adds an MSRV job
license = "GPL-3.0-or-later"
authors = ["Juan Jose Comellas <juanjo@comellas.org>"]
description = "A Rust port of the Unison file synchronizer"
publish = false

[workspace.dependencies]
gemel-compat = { path = "crates/gemel-compat" }
gemel-base = { path = "crates/gemel-base" }
gemel-fs = { path = "crates/gemel-fs" }
gemel-rpc = { path = "crates/gemel-rpc" }
gemel-engine = { path = "crates/gemel-engine" }
gemel-ui-api = { path = "crates/gemel-ui-api" }
md-5 = "0.11"
libc = "0.2"
notify = "8.2"
tokio = { version = "1.54.0", default-features = false, features = ["io-std", "io-util", "rt", "sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Time"] }

[workspace.lints.rust]
# `deny` rather than `forbid` so that gemel-fs can opt in for FFI
# (xattr/ACL/clonefile) with a crate-level `#![allow(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
# The engine runs on a single-threaded runtime with RefCell state; a borrow
# held across an await can panic when another task on the thread borrows.
await_holding_refcell_ref = "deny"
unimplemented = "deny"
